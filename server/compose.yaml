services:
  gallery:
    image: wowspotlight-gallery:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      SPOTLIGHT_GALLERY_TOKEN: ${SPOTLIGHT_GALLERY_TOKEN:?Configure a gallery publishing token}
    ports:
      - "${SPOTLIGHT_GALLERY_BIND:-127.0.0.1}:${SPOTLIGHT_GALLERY_PORT:-9093}:8780"
    volumes:
      - dances:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8780/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

volumes:
  dances:
